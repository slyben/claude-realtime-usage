<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude Usage</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --border: #22262d; --text: #e6e8eb;
    --muted: #8b929c; --accent: #2dd4a7;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --border: #dfe2e6; --text: #1b1f24; --muted: #5b6470; --accent: #17b489; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .warn { background: #3a2a0a; color: #f0b90b; border: 1px solid #6b4f0a; border-radius: 6px; padding: 8px 12px; font-size: 12px; margin-bottom: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; min-width: 160px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 20px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; overflow-x: auto; flex: 0 0 auto; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 13px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-head h2, .panel-head .controls { margin-bottom: 0; }
  select, .toggle { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 10px; }
  svg { display: block; min-width: 400px; flex: 1 1 auto; }
  .bar { cursor: pointer; }
  .bar:hover { opacity: 0.8; }
  .axis text { fill: var(--muted); font-size: 10px; }
  .chart-wrap { display: flex; align-items: flex-start; gap: 16px; }
  .legend {
    flex: 0 0 340px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
    align-content: start;
    font-size: 11px; color: var(--muted); max-height: 320px; overflow-y: auto;
    padding-left: 10px; border-left: 1px solid var(--border);
  }
  .legend .item { display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  tr:hover td { background: rgba(128,128,128,0.06); cursor: pointer; }
  .tt { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; pointer-events: none; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 10; }
  .bar-menu {
    position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px; font-size: 12px; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 20;
    max-height: 220px; overflow-y: auto; min-width: 200px;
  }
  .bar-menu-title { color: var(--muted); padding: 4px 8px 6px; font-size: 11px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .bar-menu-item { padding: 5px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .bar-menu-item:hover { background: rgba(128,128,128,0.12); }
  #mainView { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #sessionDetail { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .panel-grow { flex: 1 1 auto; min-height: 180px; display: flex; flex-direction: column; overflow: hidden; }
  .scroll-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .detail-bar {
    flex: 0 0 auto; background: var(--bg);
    display: flex; align-items: center; gap: 12px; padding: 4px 0 12px;
  }
  .back-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .back-btn:hover { background: rgba(128,128,128,0.1); }
  .detail-meta { font-size: 12px; color: var(--muted); }
  .load-more-btn {
    display: block; width: 100%; margin: 10px 0 4px; padding: 8px 14px; font-size: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); cursor: pointer;
  }
  .load-more-btn:hover { background: rgba(128,128,128,0.1); }
  .detail-action { margin-left: auto; font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; }
  .transcript { flex: 1 1 auto; min-height: 200px; overflow-y: auto; padding-right: 4px; }
  .turn { margin-bottom: 14px; max-width: 900px; }
  /* time | in | out | cached | $ | chevron | role-dot+preview — an "invisible table":
     grid columns for alignment, no visible cell borders/backgrounds. */
  /* widths are tight fits to real data (see chat history): in/out top out around 20-27K,
     cached up to ~6 digits formatted, cost up to ~$7.80 — any leftover width goes to the
     1fr text column at the end, not to these. */
  .turn-grid-cols { grid-template-columns: 44px 5ch 5ch 6ch 6ch 12px 1fr; }
  .turn-head {
    display: grid; align-items: baseline; gap: 2px 6px; font-size: 11px; color: var(--muted);
    margin-bottom: 4px; cursor: pointer; user-select: none;
  }
  .turn-head:hover { color: var(--text); }
  .turn-time { font-variant-numeric: tabular-nums; }
  .turn-num { text-align: right; font-variant-numeric: tabular-nums; }
  .turn-num.cold-cache { color: #f0648b; text-decoration: underline dotted; text-decoration-color: rgba(240,100,139,0.6); cursor: help; }
  .turn-chevron { text-align: center; }
  .role-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .role-dot-user { background: var(--accent); }
  .role-dot-assistant { background: #5b8def; }
  .turn-roletext { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
  .turn-preview {
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .turn-head-labels {
    display: grid; align-items: center; gap: 4px 6px; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .03em; padding-bottom: 4px; margin-bottom: 6px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  .turn-body { display: none; }
  .turn.expanded .turn-body { display: block; }
  .turn.expanded .turn-preview { display: none; }
  .turn-head.visible-max-metric { border-radius: 6px; margin: -2px -6px; padding: 2px 6px; }
  .fold-controls { margin-left: auto; display: flex; gap: 10px; }
  .fold-controls button {
    background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer;
    text-decoration: underline; padding: 0;
  }
  .bubble {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .turn-user .bubble { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  .thinking-block, .tool-step { margin-top: 6px; }
  .thinking-block summary, .tool-step summary {
    cursor: pointer; font-size: 12px; color: var(--muted); padding: 6px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; list-style: none;
  }
  .thinking-block summary::-webkit-details-marker, .tool-step summary::-webkit-details-marker { display: none; }
  .tool-step[open] summary, .thinking-block[open] summary { border-radius: 8px 8px 0 0; }
  .tool-step .tool-body, .thinking-block .thinking-body {
    border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px;
    padding: 10px 14px; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto;
  }
  .tool-body .tool-input { color: var(--muted); margin-bottom: 8px; }
  .tool-body .tool-result-error { color: #f0648b; }
  .tool-pending { color: var(--muted); font-style: italic; }
  .attach-note { color: var(--muted); font-style: italic; font-size: 12px; }
  .turn-chart-panel { flex: 0 0 auto; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .turn-chart-panel svg { display: block; width: 100%; cursor: pointer; user-select: none; }
  .turn-chart-legend { display: inline-flex; gap: 10px; margin-left: 8px; font-size: 11px; color: var(--muted); }
  .partial-badge {
    margin-left: 8px; font-size: 11px; color: #f0b90b; background: rgba(240,185,11,0.12);
    border: 1px solid rgba(240,185,11,0.35); border-radius: 10px; padding: 1px 8px;
  }
  .turn-chart-legend .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  .turn-chart-overlay { fill: rgba(255,255,255,0.18); stroke: var(--text); stroke-width: 1; cursor: grab; }
  .turn-chart-overlay:active { cursor: grabbing; }
</style>
</head>
<body>
<h1>Claude Usage</h1>
<div class="sub" id="genAt"></div>
<div class="warn" id="unknownWarn" style="display:none"></div>

<div id="mainView">
<div class="row">
  <div class="tile"><div class="label">Cost</div><div class="value" id="totalCost">$0.00</div></div>
  <div class="tile"><div class="label">Tokens Used</div><div class="value" id="totalTokens">0</div></div>
  <div class="tile"><div class="label">Sessions</div><div class="value" id="totalSessions">0</div></div>
</div>

<div class="panel">
  <div class="panel-head">
    <h2>Cost per day</h2>
    <div class="controls">
      <span>Range:</span>
      <select id="rangeSel">
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="9999">All time</option>
      </select>
      <span>Metric:</span>
      <select id="metricSel">
        <option value="cost" selected>Cost ($)</option>
        <option value="tokens">Tokens</option>
      </select>
    </div>
  </div>
  <div class="chart-wrap">
    <svg id="chart" width="900" height="320"></svg>
    <div class="legend" id="legend"></div>
  </div>
</div>

<div class="panel panel-grow">
  <h2>Sessions</h2>
  <div class="controls">
    <label class="toggle"><input type="checkbox" id="titleToggle"> Show session title (ai-title) instead of project</label>
    <span id="sensitiveNote" style="display:none;color:var(--muted)">Titles are generated locally by Claude Code and never leave this file.</span>
  </div>
  <div class="scroll-area">
  <table>
    <thead><tr><th>Date</th><th id="labelCol">Project</th><th>Cost</th><th>Tokens</th><th>Messages</th><th>Model(s)</th></tr></thead>
    <tbody id="sessionBody"></tbody>
  </table>
  </div>
</div>
</div>

<div id="sessionDetail">
  <div class="detail-bar">
    <button class="back-btn" id="backBtn">&larr; Back</button>
    <span class="detail-meta" id="detailMeta"></span>
    <div class="fold-controls">
      <button id="expandAllBtn">Expand all</button>
      <button id="collapseAllBtn">Collapse all</button>
    </div>
    <button class="detail-action" id="copyPathBtn">Copy file path</button>
  </div>
  <div class="transcript" id="transcript"><span class="tool-pending">Loading...</span></div>
  <div class="turn-chart-panel">
    <div class="controls" style="margin-bottom:6px;">
      <span style="font-size:11px;color:var(--muted)">Per-turn usage:</span>
      <select id="turnChartMetric">
        <option value="in">Tokens In</option>
        <option value="out">Tokens Out</option>
        <option value="cache">Tokens Cached</option>
        <option value="cost" selected>Cost ($)</option>
      </select>
      <span class="turn-chart-legend" id="turnChartLegend"></span>
      <label class="toggle" id="hideColdCacheWrap" style="display:none">
        <input type="checkbox" id="hideColdCacheToggle"> Hide cold-cache spikes
      </label>
      <span class="partial-badge" id="turnChartPartialBadge" style="display:none"></span>
    </div>
    <svg id="turnChart" width="900" height="70"></svg>
  </div>
</div>

<div class="tt" id="tooltip"></div>
<div class="bar-menu" id="barMenu"></div>

<script>
const DATA = __USAGE_DATA__;
const PRICING = __PRICING_DATA__;

const PALETTE = ["#2dd4a7","#5b8def","#f0b90b","#f0648b","#a78bfa","#4dd0e1","#ff8a65","#81c784","#ba68c8","#90a4ae"];
function colorFor(key) {
  let h = 0;
  for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function pad2(n) { return String(n).padStart(2, '0'); }
// European convention: DD-MM[-YYYY]
function fmtDateEU(isoDateStr, withYear = true) {
  const [y, m, d] = isoDateStr.slice(0, 10).split('-');
  return withYear ? `${d}-${m}-${y}` : `${d}-${m}`;
}
function fmtDateTimeEU(isoStr) {
  const dt = new Date(isoStr);
  return `${pad2(dt.getDate())}-${pad2(dt.getMonth()+1)}-${dt.getFullYear()} ${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`;
}

document.getElementById('genAt').textContent = 'Generated ' + fmtDateTimeEU(DATA.generated_at) +
  ' from local ~/.claude/projects logs — nothing here is sent anywhere.';

if (DATA.unknown_models && DATA.unknown_models.length) {
  const w = document.getElementById('unknownWarn');
  w.style.display = 'block';
  w.textContent = 'Unknown model pricing (costed at $0): ' + DATA.unknown_models.join(', ') + ' — add rates to pricing.json and re-run parse.py.';
}

function fmtUSD(v) { return '$' + v.toLocaleString(undefined, {maximumFractionDigits: 2}); }
function fmtTok(v) {
  if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(1) + 'K';
  return String(v);
}

function renderTiles() {
  document.getElementById('totalCost').textContent = fmtUSD(DATA.totals.cost);
  const tot = DATA.totals.input_tokens + DATA.totals.output_tokens + DATA.totals.cache_write_tokens + DATA.totals.cache_read_tokens;
  document.getElementById('totalTokens').textContent = fmtTok(tot);
  document.getElementById('totalSessions').textContent = DATA.sessions.length;
}

function renderChart() {
  hideBarMenu();
  const rangeDays = parseInt(document.getElementById('rangeSel').value, 10);
  const metric = document.getElementById('metricSel').value;

  const today = new Date();
  const cutoff = new Date(today.getTime() - rangeDays * 86400000);

  // group by date -> project -> value
  const byDate = new Map();
  const projects = new Set();
  for (const row of DATA.daily) {
    const d = new Date(row.date);
    if (d < cutoff) continue;
    projects.add(row.project);
    if (!byDate.has(row.date)) byDate.set(row.date, {});
    const val = metric === 'cost' ? row.cost
      : row.input_tokens + row.output_tokens + row.cache_write_tokens + row.cache_read_tokens;
    byDate.get(row.date)[row.project] = (byDate.get(row.date)[row.project] || 0) + val;
  }

  const dates = Array.from(byDate.keys()).sort();
  const projList = Array.from(projects).sort();

  const svg = document.getElementById('chart');
  svg.innerHTML = '';
  const wrap = document.querySelector('.chart-wrap');
  const legendW = 340 + 16; // .legend flex-basis + gap
  const W = Math.max(400, wrap.clientWidth - legendW);
  svg.setAttribute('width', W);
  const H = svg.height.baseVal.value;
  const padL = 60, padB = 30, padT = 10, padR = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  if (dates.length === 0) return;

  let maxVal = 0;
  for (const d of dates) {
    const total = Object.values(byDate.get(d)).reduce((a,b)=>a+b, 0);
    maxVal = Math.max(maxVal, total);
  }
  maxVal = maxVal * 1.1 || 1;

  const barW = Math.max(2, plotW / dates.length * 0.7);
  const step = plotW / dates.length;

  // y-axis gridlines
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const y = padT + plotH - (plotH * i / ticks);
    const val = maxVal * i / ticks;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', 'var(--border)'); line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', padL - 8); text.setAttribute('y', y + 3);
    text.setAttribute('text-anchor', 'end'); text.setAttribute('class', 'axis');
    text.textContent = metric === 'cost' ? '$' + val.toFixed(0) : fmtTok(val);
    text.setAttribute('fill', 'var(--muted)'); text.setAttribute('font-size', '10');
    svg.appendChild(text);
  }

  const tooltip = document.getElementById('tooltip');

  dates.forEach((date, i) => {
    const x = padL + i * step + (step - barW) / 2;
    let yCursor = padT + plotH;
    const dayData = byDate.get(date);
    for (const proj of projList) {
      const v = dayData[proj];
      if (!v) continue;
      const h = (v / maxVal) * plotH;
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x', x); rect.setAttribute('width', barW);
      rect.setAttribute('y', yCursor - h); rect.setAttribute('height', h);
      rect.setAttribute('fill', colorFor(proj));
      rect.setAttribute('class', 'bar');
      rect.addEventListener('mousemove', (e) => {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.pageX + 12) + 'px';
        tooltip.style.top = (e.pageY - 10) + 'px';
        const label = metric === 'cost' ? fmtUSD(v) : fmtTok(v);
        tooltip.innerHTML = `<b>${fmtDateEU(date)}</b><br>${proj}: ${label}`;
      });
      rect.addEventListener('mouseleave', () => tooltip.style.display = 'none');
      rect.addEventListener('click', (e) => {
        e.stopPropagation();
        tooltip.style.display = 'none';
        showBarSessionPicker(date, proj, e);
      });
      svg.appendChild(rect);
      yCursor -= h;
    }
  });

  // x-axis labels, thinned
  const labelEvery = Math.ceil(dates.length / 12);
  dates.forEach((date, i) => {
    if (i % labelEvery !== 0) return;
    const x = padL + i * step + step/2;
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', x); text.setAttribute('y', H - padB + 14);
    text.setAttribute('text-anchor', 'middle'); text.setAttribute('class', 'axis');
    text.setAttribute('fill', 'var(--muted)'); text.setAttribute('font-size', '10');
    text.textContent = fmtDateEU(date, false);
    svg.appendChild(text);
  });

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  projList.forEach(p => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<span class="swatch" style="background:${colorFor(p)}"></span>${p}`;
    legend.appendChild(item);
  });
}

window.addEventListener('resize', renderChart);

function renderSessions() {
  const showTitle = document.getElementById('titleToggle').checked;
  document.getElementById('labelCol').textContent = showTitle ? 'Session title' : 'Project';
  document.getElementById('sensitiveNote').style.display = showTitle ? 'inline' : 'none';

  const body = document.getElementById('sessionBody');
  body.innerHTML = '';
  const sorted = [...DATA.sessions].sort((a,b) => b.cost - a.cost);
  for (const s of sorted) {
    const tr = document.createElement('tr');
    const date = s.first_ts ? fmtDateEU(s.first_ts) : '?';
    const label = showTitle ? (s.ai_title || '(untitled)') : s.project;
    const tokens = s.input_tokens + s.output_tokens + s.cache_write_tokens + s.cache_read_tokens;
    tr.innerHTML = `<td>${date}</td><td>${label}</td><td>${fmtUSD(s.cost)}</td><td>${fmtTok(tokens)}</td><td>${s.messages}</td><td>${s.models.join(', ')}</td>`;
    tr.addEventListener('click', () => showSessionDetail(s));
    body.appendChild(tr);
  }
}

// --- session detail view: chat-transcript rendering of the raw JSONL ---

function safeFilename(key) {
  return key.replace(/[^A-Za-z0-9_-]/g, '_');
}

const CHUNK_SIZE = 1_000_000; // load raw JSONL / transcript in chunks this big, to keep huge sessions from freezing the tab
const AUTO_LOAD_REMAINDER = 200_000; // if what's left after a chunk is this small, just load it instead of showing a button for a sliver

// end index of the next chunk starting at `start`, cut at a line boundary
function chunkEnd(text, start, size) {
  let end = Math.min(text.length, start + size);
  if (end < text.length) {
    const nl = text.lastIndexOf('\n', end);
    if (nl > start) end = nl;
  }
  return end;
}

function makeLoadMoreButton(remaining, onClick) {
  const btn = document.createElement('button');
  btn.className = 'load-more-btn';
  btn.textContent = `Load more (${fmtTok(remaining)} characters remaining)`;
  btn.addEventListener('click', onClick);
  return btn;
}

// mirrors parse.py's cost_for_usage()
function stepCost(model, usage) {
  const rates = PRICING[model];
  if (!rates) return null;
  const cc = usage.cache_creation || {};
  let write5m = cc.ephemeral_5m_input_tokens || 0;
  const write1h = cc.ephemeral_1h_input_tokens || 0;
  if (!usage.cache_creation && usage.cache_creation_input_tokens) write5m = usage.cache_creation_input_tokens;
  const input = usage.input_tokens || 0;
  const output = usage.output_tokens || 0;
  const read = usage.cache_read_input_tokens || 0;
  const cost = (input * rates.input + output * rates.output +
    write5m * rates.cache_write_5m + write1h * rates.cache_write_1h + read * rates.cache_read) / 1e6;
  const writeTokens = write5m + write1h;
  return { cost, cacheTokens: writeTokens + read, writeTokens, readTokens: read };
}

function extractToolResultText(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map(b => {
      if (b.type === 'text') return b.text;
      if (b.type === 'tool_reference') return `[tool reference: ${b.tool_name}]`;
      if (b.type === 'image') return '[image]';
      return '';
    }).filter(Boolean).join('\n');
  }
  return '';
}

function parseSessionJsonl(rawText, toolSteps) {
  // toolSteps: tool_use id -> step object, mutated in place when its result arrives.
  // Passed in (rather than created here) so it persists across chunked loads.
  if (!toolSteps) toolSteps = new Map();
  const turns = [];

  for (const line of rawText.split('\n')) {
    if (!line.trim()) continue;
    let d;
    try { d = JSON.parse(line); } catch { continue; }

    if (d.type === 'user') {
      const content = d.message && d.message.content;
      if (typeof content === 'string') {
        if (content.trim()) turns.push({ role: 'user', ts: d.timestamp, blocks: [{ kind: 'text', text: content }] });
      } else if (Array.isArray(content)) {
        const hasToolResult = content.some(b => b.type === 'tool_result');
        if (hasToolResult) {
          content.forEach(b => {
            if (b.type !== 'tool_result') return;
            const step = toolSteps.get(b.tool_use_id);
            if (step) step.result = { content: extractToolResultText(b.content), isError: !!b.is_error };
          });
        } else {
          const blocks = [];
          content.forEach(b => {
            if (b.type === 'text' && b.text) blocks.push({ kind: 'text', text: b.text });
            else if (b.type === 'image') blocks.push({ kind: 'text', text: '[image attached]' });
            else if (b.type === 'document') blocks.push({ kind: 'text', text: '[document attached]' });
          });
          if (blocks.length) turns.push({ role: 'user', ts: d.timestamp, blocks });
        }
      }
    } else if (d.type === 'assistant') {
      const msg = d.message || {};
      const content = Array.isArray(msg.content) ? msg.content : [];
      const blocks = [];
      content.forEach(b => {
        if (b.type === 'text' && b.text) blocks.push({ kind: 'text', text: b.text });
        else if (b.type === 'thinking' && b.thinking) blocks.push({ kind: 'thinking', text: b.thinking });
        else if (b.type === 'tool_use') {
          const step = { id: b.id, name: b.name, input: b.input, result: null };
          toolSteps.set(b.id, step);
          blocks.push({ kind: 'tool', step });
        }
      });
      if (blocks.length) turns.push({ role: 'assistant', ts: d.timestamp, model: msg.model, usage: msg.usage, blocks });
    }
  }
  return turns;
}

function summarizeToolInput(input) {
  if (!input) return '';
  for (const key of ['file_path', 'pattern', 'query', 'url']) {
    if (typeof input[key] === 'string') return input[key];
  }
  for (const key of ['command', 'prompt', 'description']) {
    if (typeof input[key] === 'string') return input[key].length > 80 ? input[key].slice(0, 80) + '…' : input[key];
  }
  return '';
}

function renderToolStep(step) {
  const details = document.createElement('details');
  details.className = 'tool-step';
  const summary = document.createElement('summary');
  const inputSummary = summarizeToolInput(step.input);
  summary.textContent = `🔧 ${step.name}${inputSummary ? ' — ' + inputSummary : ''}` +
    (step.result && step.result.isError ? ' (error)' : '');
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'tool-body';
  const inputDiv = document.createElement('div');
  inputDiv.className = 'tool-input';
  inputDiv.textContent = 'Input: ' + JSON.stringify(step.input, null, 2);
  body.appendChild(inputDiv);
  const resultDiv = document.createElement('div');
  if (step.result) {
    if (step.result.isError) resultDiv.className = 'tool-result-error';
    resultDiv.textContent = step.result.content || '(empty result)';
  } else {
    resultDiv.className = 'tool-pending';
    resultDiv.textContent = '(no result recorded)';
  }
  body.appendChild(resultDiv);
  details.appendChild(body);
  return details;
}

function turnPreview(turn) {
  const textBlock = turn.blocks.find(b => b.kind === 'text');
  if (textBlock) {
    const t = textBlock.text.replace(/\s+/g, ' ').trim();
    return t.length > 100 ? t.slice(0, 100) + '…' : t;
  }
  const toolBlocks = turn.blocks.filter(b => b.kind === 'tool');
  if (toolBlocks.length) return toolBlocks.map(b => b.step.name).join(', ');
  if (turn.blocks.some(b => b.kind === 'thinking')) return '🧠 thinking';
  return '';
}

function makeTranscriptHeaderRow() {
  const row = document.createElement('div');
  row.className = 'turn-head-labels turn-grid-cols';
  ['', 'In', 'Out', 'Cached', '$', '', ''].forEach((label, i) => {
    const cell = document.createElement('span');
    if (i >= 1 && i <= 4) cell.className = 'turn-num';
    cell.textContent = label;
    row.appendChild(cell);
  });
  return row;
}

function appendTranscriptTurns(container, turns) {
  turns.forEach(turn => {
    const div = document.createElement('div');
    div.className = 'turn turn-' + turn.role; // folded by default: no 'expanded' class

    const head = document.createElement('div');
    head.className = 'turn-head turn-grid-cols';

    const timeSpan = document.createElement('span');
    timeSpan.className = 'turn-time';
    timeSpan.textContent = turn.ts ? new Date(turn.ts).toISOString().slice(11, 19) : '';
    head.appendChild(timeSpan);

    let inTok = 0, outTok = 0, cacheTok = 0, cost = null, coldCache = false, coldCacheTitle = '';
    if (turn.role === 'assistant' && turn.usage) {
      const u = turn.usage;
      inTok = u.input_tokens || 0;
      outTok = u.output_tokens || 0;
      const costInfo = turn.model ? stepCost(turn.model, u) : null;
      cacheTok = costInfo ? costInfo.cacheTokens : 0;
      cost = costInfo ? costInfo.cost : 0;
      // cache writes are normally a small increment on top of a large cache read (the bulk
      // of the conversation being reused cheaply); when writes meet or exceed reads, the
      // cache mostly missed this turn - context had to be resent/rebuilt (e.g. after the
      // 5m/1h cache window expired from stepping away) - which costs a lot more per token.
      if (costInfo && costInfo.writeTokens > 0 && costInfo.writeTokens >= costInfo.readTokens) {
        coldCache = true;
        coldCacheTitle = `Cache mostly missed this turn: ${fmtTok(costInfo.writeTokens)} tokens had to be rewritten vs only ${fmtTok(costInfo.readTokens)} read from cache - likely returned to this session after the cache window expired.`;
      }
      turnUsagePoints.push({ div, head, inTok, outTok, cacheTok, cost: cost || 0, coldCache });
    }
    const numCell = (text, opts) => {
      const c = document.createElement('span');
      c.className = 'turn-num' + (opts && opts.cls ? ' ' + opts.cls : '');
      c.textContent = text;
      if (opts && opts.title) c.title = opts.title;
      return c;
    };
    head.appendChild(numCell(inTok ? fmtTok(inTok) : ''));
    head.appendChild(numCell(outTok ? fmtTok(outTok) : ''));
    head.appendChild(numCell(cacheTok ? fmtTok(cacheTok) : ''));
    head.appendChild(numCell(cost ? fmtUSD(cost) : '', coldCache ? { cls: 'cold-cache', title: coldCacheTitle } : null));

    const chevron = document.createElement('span');
    chevron.className = 'turn-chevron';
    chevron.textContent = '▸';
    head.appendChild(chevron);

    const roletext = document.createElement('span');
    roletext.className = 'turn-roletext';
    const dot = document.createElement('span');
    dot.className = 'role-dot role-dot-' + turn.role;
    dot.title = turn.role === 'user' ? 'You' : 'Claude';
    roletext.appendChild(dot);
    const previewSpan = document.createElement('span');
    previewSpan.className = 'turn-preview';
    previewSpan.textContent = turnPreview(turn);
    roletext.appendChild(previewSpan);
    head.appendChild(roletext);

    head.addEventListener('click', () => {
      const expanded = div.classList.toggle('expanded');
      chevron.textContent = expanded ? '▾' : '▸';
    });
    div.appendChild(head);

    const body = document.createElement('div');
    body.className = 'turn-body';
    turn.blocks.forEach(b => {
      if (b.kind === 'text') {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = b.text;
        body.appendChild(bubble);
      } else if (b.kind === 'thinking') {
        const details = document.createElement('details');
        details.className = 'thinking-block';
        const summary = document.createElement('summary');
        summary.textContent = '🧠 Thinking';
        details.appendChild(summary);
        const tbody = document.createElement('div');
        tbody.className = 'thinking-body';
        tbody.textContent = b.text;
        details.appendChild(tbody);
        body.appendChild(details);
      } else if (b.kind === 'tool') {
        body.appendChild(renderToolStep(b.step));
      }
    });
    div.appendChild(body);

    container.appendChild(div);
  });
  renderTurnChart();
  queueMaxHighlightUpdate();
}

let currentDetailSid = null;
let currentDetailPaths = [];
let transcriptState = null; // { rawText, pos, toolSteps } — chunked-load progress for the chat transcript
let turnUsagePoints = []; // per assistant-turn {div, inTok, outTok, cacheTok, cost}, grows as chunks load; values are never recomputed once pushed

function loadNextTranscriptChunk() {
  const container = document.getElementById('transcript');
  const existingBtn = container.querySelector('.load-more-btn');
  if (existingBtn) existingBtn.remove();

  const { rawText } = transcriptState;
  const end = chunkEnd(rawText, transcriptState.pos, CHUNK_SIZE);
  const chunkText = rawText.slice(transcriptState.pos, end);
  transcriptState.pos = end;

  appendTranscriptTurns(container, parseSessionJsonl(chunkText, transcriptState.toolSteps));

  const remaining = rawText.length - transcriptState.pos;
  if (remaining <= 0) return;
  if (remaining <= AUTO_LOAD_REMAINDER) {
    loadNextTranscriptChunk();
  } else {
    container.appendChild(makeLoadMoreButton(remaining, loadNextTranscriptChunk));
  }
}

const TOKEN_COLORS = { in: '#2dd4a7', out: '#5b8def', cache: '#8b929c' };
const COST_COLOR = '#f0b90b';
// each mode is its own single-series scale — cached tokens run 10-100x larger than
// in/out, so a combined/stacked bar always looked like solid cache and masked the rest.
// highlightBg mirrors `color` at low alpha, used for the visible-max-in-view highlight.
const METRIC_CONF = {
  in: { get: p => p.inTok, color: TOKEN_COLORS.in, highlightBg: 'rgba(45,212,167,0.18)' },
  out: { get: p => p.outTok, color: TOKEN_COLORS.out, highlightBg: 'rgba(91,141,239,0.18)' },
  cache: { get: p => p.cacheTok, color: TOKEN_COLORS.cache, highlightBg: 'rgba(139,146,156,0.18)' },
  cost: { get: p => p.cost, color: COST_COLOR, highlightBg: 'rgba(240,185,11,0.18)' },
};

function renderTurnChart() {
  const svg = document.getElementById('turnChart');
  const legend = document.getElementById('turnChartLegend');
  svg.innerHTML = '';
  legend.innerHTML = '';
  const metric = document.getElementById('turnChartMetric').value;
  const conf = METRIC_CONF[metric];

  const hideColdCacheWrap = document.getElementById('hideColdCacheWrap');
  hideColdCacheWrap.style.display = metric === 'cost' ? 'inline-flex' : 'none';
  const hidingColdCache = metric === 'cost' && document.getElementById('hideColdCacheToggle').checked;

  const badge = document.getElementById('turnChartPartialBadge');
  const stillLoading = transcriptState && transcriptState.pos < transcriptState.rawText.length;
  if (stillLoading) {
    const pct = Math.floor((transcriptState.pos / transcriptState.rawText.length) * 100);
    badge.textContent = `Partial — ${pct}% loaded`;
    badge.style.display = 'inline';
  } else {
    badge.style.display = 'none';
  }

  const n = turnUsagePoints.length;
  if (n === 0) return;
  const W = svg.clientWidth || 900;
  svg.setAttribute('width', W);
  const H = svg.height.baseVal.value;
  const step = W / n;
  const barW = Math.max(1, step - 1);

  let maxVal = 0;
  turnUsagePoints.forEach(p => {
    if (hidingColdCache && p.coldCache) return;
    const v = conf.get(p);
    if (v > maxVal) maxVal = v;
  });
  maxVal = maxVal * 1.1 || 1;

  const rectNS = (x, y, w, h, fill) => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y);
    r.setAttribute('width', w); r.setAttribute('height', h);
    r.setAttribute('fill', fill);
    svg.appendChild(r);
  };

  turnUsagePoints.forEach((p, i) => {
    if (hidingColdCache && p.coldCache) return;
    const x = i * step;
    const v = conf.get(p);
    const h = (v / maxVal) * H;
    const fill = (metric === 'cost' && p.coldCache) ? '#f0648b' : conf.color;
    if (h > 0) rectNS(x, H - h, barW, h, fill);
  });

  const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  overlay.setAttribute('id', 'turnChartOverlay');
  overlay.setAttribute('class', 'turn-chart-overlay');
  overlay.setAttribute('y', 0);
  overlay.setAttribute('height', H);
  svg.appendChild(overlay);
  overlay.addEventListener('mousedown', (e) => { chartDragging = true; e.preventDefault(); });

  updateChartOverlay();
}

let chartDragging = false;

function updateChartOverlay() {
  const el = document.getElementById('transcript');
  const svg = document.getElementById('turnChart');
  const overlay = document.getElementById('turnChartOverlay');
  if (!overlay) return;
  const W = svg.clientWidth || 900;
  const scrollable = el.scrollHeight > el.clientHeight;
  const frac = scrollable ? el.clientHeight / el.scrollHeight : 1;
  const startFrac = scrollable ? el.scrollTop / el.scrollHeight : 0;
  overlay.setAttribute('x', startFrac * W);
  overlay.setAttribute('width', Math.max(4, frac * W));
}

// approximate: maps a fraction of the chart's width to the same fraction of the
// transcript's scrollable height. Good enough for a minimap-style overview —
// exact per-turn boundaries would need per-scroll DOM measurement of every turn.
function scrollTranscriptToChartFrac(frac) {
  const el = document.getElementById('transcript');
  el.scrollTop = frac * el.scrollHeight;
}

function chartXToFrac(e) {
  const svg = document.getElementById('turnChart');
  const rect = svg.getBoundingClientRect();
  return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
}

document.getElementById('turnChart').addEventListener('mousedown', (e) => {
  if (e.target.id === 'turnChartOverlay') return; // overlay has its own mousedown handler
  chartDragging = true;
  scrollTranscriptToChartFrac(chartXToFrac(e));
});
window.addEventListener('mousemove', (e) => {
  if (!chartDragging) return;
  scrollTranscriptToChartFrac(chartXToFrac(e));
});
window.addEventListener('mouseup', () => { chartDragging = false; });

document.getElementById('turnChartMetric').addEventListener('change', () => { renderTurnChart(); queueMaxHighlightUpdate(); });
document.getElementById('hideColdCacheToggle').addEventListener('change', () => { renderTurnChart(); queueMaxHighlightUpdate(); });
window.addEventListener('resize', () => { if (transcriptState) { renderTurnChart(); queueMaxHighlightUpdate(); } });

let currentMaxHead = null;
let maxHighlightQueued = false;

function updateVisibleMaxHighlight() {
  maxHighlightQueued = false;
  const metric = document.getElementById('turnChartMetric').value;
  const conf = METRIC_CONF[metric];
  const hidingColdCache = metric === 'cost' && document.getElementById('hideColdCacheToggle').checked;
  const el = document.getElementById('transcript');
  const top = el.getBoundingClientRect().top;
  const bottom = top + el.clientHeight;

  let best = null, bestVal = 0;
  for (const p of turnUsagePoints) {
    if (hidingColdCache && p.coldCache) continue;
    const v = conf.get(p);
    if (!v) continue;
    const r = p.head.getBoundingClientRect();
    if (r.bottom <= top || r.top >= bottom) continue; // not visible
    if (!best || v > bestVal) { best = p; bestVal = v; }
  }

  if (currentMaxHead && currentMaxHead !== (best && best.head)) {
    currentMaxHead.classList.remove('visible-max-metric');
    currentMaxHead.style.background = '';
  }
  currentMaxHead = best ? best.head : null;
  if (currentMaxHead) {
    currentMaxHead.classList.add('visible-max-metric');
    currentMaxHead.style.background = conf.highlightBg;
  }
}

function queueMaxHighlightUpdate() {
  if (maxHighlightQueued) return;
  maxHighlightQueued = true;
  requestAnimationFrame(updateVisibleMaxHighlight);
}

let autoLoadingFromScroll = false;
document.getElementById('transcript').addEventListener('scroll', () => {
  updateChartOverlay();
  queueMaxHighlightUpdate();
  if (!transcriptState || autoLoadingFromScroll) return;
  const el = document.getElementById('transcript');
  if (transcriptState.pos < transcriptState.rawText.length &&
      el.scrollTop + el.clientHeight >= el.scrollHeight - 300) {
    autoLoadingFromScroll = true;
    loadNextTranscriptChunk();
    autoLoadingFromScroll = false;
  }
});

window.__recvSession = function(sid, text) {
  if (sid !== currentDetailSid) return; // stale load (user navigated away/to another session)

  const transcriptEl = document.getElementById('transcript');
  transcriptEl.innerHTML = '';
  transcriptEl.appendChild(makeTranscriptHeaderRow());
  transcriptState = { rawText: text, pos: 0, toolSteps: new Map() };
  try {
    loadNextTranscriptChunk();
  } catch (e) {
    transcriptEl.innerHTML = '';
    const note = document.createElement('span');
    note.className = 'attach-note';
    note.textContent = '(failed to parse transcript: ' + e.message + ')';
    transcriptEl.appendChild(note);
    return;
  }
  if (!transcriptEl.querySelector('.turn')) {
    const note = document.createElement('span');
    note.className = 'attach-note';
    note.textContent = '(no readable conversation turns found in this session)';
    transcriptEl.appendChild(note);
  }
};

function showSessionDetail(s) {
  currentDetailSid = s.session_id;
  currentDetailPaths = s.source_paths || [];
  const date = s.first_ts ? fmtDateEU(s.first_ts) : '?';
  document.getElementById('detailMeta').textContent =
    `${s.project} — ${date} — ${fmtUSD(s.cost)} — ${s.messages} messages — session ${s.session_id}`;
  document.getElementById('copyPathBtn').textContent = 'Copy file path';

  const transcriptEl = document.getElementById('transcript');
  transcriptEl.innerHTML = '<span class="tool-pending">Loading...</span>';
  transcriptEl.style.display = 'block';
  turnUsagePoints = [];
  transcriptState = null;
  currentMaxHead = null;
  renderTurnChart();

  document.getElementById('mainView').style.display = 'none';
  document.getElementById('sessionDetail').style.display = 'flex';
  window.scrollTo(0, 0);

  const notFound = () => {
    if (s.session_id === currentDetailSid) {
      transcriptEl.innerHTML = '<span class="attach-note">(no raw log file found for this session)</span>';
    }
  };

  if (location.protocol === 'file:') {
    // Opened directly (no server): fetch()/XHR of a local file is blocked by the browser, so
    // load via a dynamically-injected <script src> instead - the .js file's side effect is a
    // call to __recvSession(sid, text) below, same as the fetch path calls directly.
    const existing = document.getElementById('sessionScript');
    if (existing) existing.remove();
    const script = document.createElement('script');
    script.id = 'sessionScript';
    script.src = `sessions/${safeFilename(s.session_id)}.js`;
    script.onerror = notFound;
    document.body.appendChild(script);
  } else {
    // Server-backed (e.g. embedded in claude-realtime-usage's live_watcher.py): real http://,
    // so a plain fetch() of the unwrapped .txt sibling works and needs no script-tag trick.
    fetch(`sessions/${safeFilename(s.session_id)}.txt`)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => window.__recvSession(s.session_id, text))
      .catch(notFound);
  }
}

// document.execCommand rather than navigator.clipboard: the Clipboard API requires a
// secure context, which a plain file:// page (how this dashboard is normally opened) isn't.
function copyToClipboard(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

document.getElementById('copyPathBtn').addEventListener('click', () => {
  const btn = document.getElementById('copyPathBtn');
  if (!currentDetailPaths.length) {
    btn.textContent = 'No file path recorded';
  } else {
    const ok = copyToClipboard(currentDetailPaths.join('\n'));
    btn.textContent = !ok ? 'Copy failed'
      : currentDetailPaths.length > 1 ? `Copied ${currentDetailPaths.length} paths` : 'Copied!';
  }
  setTimeout(() => { btn.textContent = 'Copy file path'; }, 1500);
});

function setAllTurnsExpanded(expanded) {
  document.querySelectorAll('#transcript .turn').forEach(div => {
    div.classList.toggle('expanded', expanded);
    const chevron = div.querySelector('.turn-chevron');
    if (chevron) chevron.textContent = expanded ? '▾' : '▸';
  });
}
document.getElementById('expandAllBtn').addEventListener('click', () => setAllTurnsExpanded(true));
document.getElementById('collapseAllBtn').addEventListener('click', () => setAllTurnsExpanded(false));

function hideBarMenu() {
  document.getElementById('barMenu').style.display = 'none';
}
document.addEventListener('click', hideBarMenu);

function showBarSessionPicker(date, proj, evt) {
  const matches = DATA.sessions.filter(s => s.project === proj && s.first_ts && s.last_ts &&
    s.first_ts.slice(0, 10) <= date && date <= s.last_ts.slice(0, 10));
  if (matches.length === 0) return;
  if (matches.length === 1) { showSessionDetail(matches[0]); return; }

  matches.sort((a, b) => (a.first_ts || '').localeCompare(b.first_ts || ''));
  const menu = document.getElementById('barMenu');
  menu.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'bar-menu-title';
  title.textContent = `${proj} — ${fmtDateEU(date)} — ${matches.length} sessions`;
  menu.appendChild(title);
  matches.forEach(s => {
    const item = document.createElement('div');
    item.className = 'bar-menu-item';
    const startedOnClickedDay = s.first_ts.slice(0, 10) === date;
    const label = startedOnClickedDay
      ? new Date(s.first_ts).toISOString().slice(11, 16)
      : `started ${fmtDateEU(s.first_ts)}`;
    item.textContent = `${label} — ${fmtUSD(s.cost)} — ${s.messages} msgs`;
    item.addEventListener('click', (e) => { e.stopPropagation(); hideBarMenu(); showSessionDetail(s); });
    menu.appendChild(item);
  });
  menu.style.display = 'block';
  menu.style.left = (evt.pageX + 12) + 'px';
  menu.style.top = (evt.pageY - 10) + 'px';
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('sessionDetail').style.display = 'none';
  document.getElementById('mainView').style.display = 'flex';
});

document.getElementById('rangeSel').addEventListener('change', renderChart);
document.getElementById('metricSel').addEventListener('change', renderChart);
document.getElementById('titleToggle').addEventListener('change', renderSessions);

renderTiles();
renderChart();
renderSessions();
</script>
